version: '3'

env:
  GOWORK: 'off'

vars:
  GOVULNCHECK_VERSION: v1.8.0
  GOLANGCI_LINT_VERSION: v2.14.0

tasks:
  default:
    cmds: [{task: build}]
  list:
    desc: List available tasks
    cmds: ['task --list-all']
  fmt:
    desc: Format Go source
    cmds: ['gofmt -w .']
  fmt-check:
    desc: Check Go formatting without changing files
    cmds:
      - |
        files="$(gofmt -l .)"
        if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi
  go-tidy:
    desc: Update module metadata
    cmds: ['go mod tidy', 'go -C examples mod tidy']
  go-tidy-check:
    aliases: [tidy-check]
    desc: Check module metadata without changing files
    cmds: ['go mod tidy -diff', 'go -C examples mod tidy -diff']
  go-verify:
    desc: Verify downloaded module contents
    cmds: ['go mod verify', 'go -C examples mod verify']
  test:
    desc: Run tests, root and examples modules
    cmds: ['go test -mod=readonly ./...', 'go -C examples test -mod=readonly ./...']
  test-race:
    desc: Run tests with the race detector
    cmds: ['go test -mod=readonly -race ./...', 'go -C examples test -mod=readonly -race ./...']
  vet:
    desc: Run Go vet
    cmds: ['go vet -mod=readonly ./...', 'go -C examples vet -mod=readonly ./...']
  lint-install:
    internal: true
    run: once
    env: {GOOS: '', GOARCH: '', GOBIN: '{{.ROOT_DIR}}/.task/bin'}
    cmds:
      - |
        if test -x "{{.ROOT_DIR}}/.task/bin/golangci-lint"; then
          exit 0
        fi
        V="{{.GOLANGCI_LINT_VERSION}}"
        if command -v golangci-lint >/dev/null && golangci-lint version 2>/dev/null | grep -Fq "${V#v}"; then
          exit 0
        fi
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
  lint:
    desc: Run golangci-lint across root and examples modules
    cmds:
      - task: lint-install
      - |
        if test -x "{{.ROOT_DIR}}/.task/bin/golangci-lint"; then
          LINTER="{{.ROOT_DIR}}/.task/bin/golangci-lint"
        else
          LINTER="$(command -v golangci-lint)"
        fi
        "$LINTER" run ./...
        (cd examples && "$LINTER" run ./...)
  build:
    desc: Build the library and the demo
    cmds:
      - go build -mod=readonly ./...
      - task: build-examples
  build-examples:
    desc: Build bin/nttypeset-typeset, bin/nttypeset-specimen and bin/nttypeset-hackernews
    cmds:
      - mkdir -p bin
      - go -C examples build -mod=readonly -o ../bin/nttypeset-typeset ./typeset
      - go -C examples build -mod=readonly -o ../bin/nttypeset-specimen ./specimen
      - go -C examples build -mod=readonly -o ../bin/nttypeset-hackernews ./hackernews
  run-typeset:
    desc: Run the demo (task run-typeset -- -dark FILE)
    cmds: ['go -C examples run -mod=readonly ./typeset {{.CLI_ARGS}}']
  run-specimen:
    desc: Run the font specimen (task run-specimen -- -dark)
    cmds: ['go -C examples run -mod=readonly ./specimen {{.CLI_ARGS}}']
  run-hackernews:
    desc: Read the live Hacker News front page
    cmds: ['go -C examples run -mod=readonly ./hackernews {{.CLI_ARGS}}']
  cross-windows:
    desc: Check Windows compilation
    env: {GOOS: windows, GOARCH: amd64, CGO_ENABLED: '0'}
    cmds:
      - go build -mod=readonly ./...
      - mkdir -p dist
      - go -C examples build -mod=readonly -o ../dist/nttypeset-typeset.exe ./typeset
      - go -C examples build -mod=readonly -o ../dist/nttypeset-specimen.exe ./specimen
      - go -C examples build -mod=readonly -o ../dist/nttypeset-hackernews.exe ./hackernews
  cross-wasm:
    desc: Check js/wasm compilation
    env: {GOOS: js, GOARCH: wasm, CGO_ENABLED: '0'}
    cmds: ['go build -mod=readonly ./...']
  notices:
    desc: Regenerate dependency notices
    cmds: ['go run ./internal/tools/notices > THIRD_PARTY_NOTICES.md']
  notices-check:
    desc: Check generated notices without modifying tracked files
    cmds:
      - mkdir -p dist
      - go run ./internal/tools/notices > dist/THIRD_PARTY_NOTICES.md
      - diff -u THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
  vulncheck-install:
    internal: true
    run: once
    env: {GOOS: '', GOARCH: '', GOBIN: '{{.ROOT_DIR}}/.task/bin'}
    cmds: ['go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}']
  vulncheck:
    desc: Scan dependencies for known vulnerabilities (requires network)
    cmds:
      - task: vulncheck-install
      - '"{{.ROOT_DIR}}/.task/bin/govulncheck" -test ./...'
      - cmd: '"{{.ROOT_DIR}}/.task/bin/govulncheck" -test ./...'
        dir: examples
  build-wasm:
    desc: Build the browser demos into web/demos/
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p web/demos
      - for: [typeset, specimen, hackernews]
        cmd: go -C examples build -mod=readonly -trimpath -ldflags='-s -w' -o ../web/demos/{{.ITEM}}.wasm ./{{.ITEM}}
  build-wasm-site:
    desc: Build the browser demos and export the pinned booba runtime into web/
    cmds:
      - task: build-wasm
      - go -C examples tool booba-assets --no-index ../web
      - cp LICENSE THIRD_PARTY_NOTICES.md web/
      - task: check-site
  check-site:
    desc: Check site script syntax, required assets, and all demos under Node
    cmds:
      - node --check web/site.js
      - node scripts/check-site.mjs
      - node scripts/smoke-demo.mjs typeset
      - node scripts/smoke-demo.mjs specimen
      - node scripts/smoke-demo.mjs hackernews
      - node scripts/smoke-demo.mjs typeset keep
  serve-wasm-site:
    desc: Serve web/ at http://localhost:8000/nttypeset/ (matches the Pages prefix)
    deps: [build-wasm-site]
    vars:
      SERVE_DIR: /tmp/nttypeset-site
      SERVE_PORT: '{{.SERVE_PORT | default "8000"}}'
    cmds:
      - mkdir -p "{{.SERVE_DIR}}"
      - ln -sfn "$PWD/web" "{{.SERVE_DIR}}/nttypeset"
      - python3 -m http.server {{.SERVE_PORT}} --bind 127.0.0.1 --directory "{{.SERVE_DIR}}"
  test-wasm:
    desc: Test the examples module under js/wasm with Node
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - 'go -C examples test -mod=readonly -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./...'
  vulncheck-wasm:
    desc: Scan the browser build's dependencies (requires network)
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - task: vulncheck-install
      - cmd: '"{{.ROOT_DIR}}/.task/bin/govulncheck" ./...'
        dir: examples
  ci:
    desc: Full portable CI gate
    cmds:
      - task: fmt-check
      - task: go-tidy-check
      - task: go-verify
      - task: test-race
      - task: vet
      - task: lint
      - task: cross-windows
      - task: cross-wasm
      - task: build
      - task: notices-check
      - task: vulncheck
      - task: build-wasm-site
      - task: test-wasm
      - task: vulncheck-wasm
  clean:
    desc: Remove generated binaries and task tools
    cmds: ['rm -rf bin dist .task web/demos web/booba web/ghostty-web web/wasm_exec.js web/LICENSE web/THIRD_PARTY_NOTICES.md']
